name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  repo-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Keep checks in sync with `tools/run-repo-sanity.py` (local mirror).
      - name: repo-sanity
        run: python3 tools/run-repo-sanity.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # eframe / egui — same baseline as release.yml for Linux UI builds.
      - name: Install Linux UI build deps (eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev \
            libgl1-mesa-dev libglib2.0-dev libgtk-3-dev

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (mhrv-f, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test (mhrv-f, ui)
        run: cargo test --all-targets --features ui

      - name: clippy (tunnel-node)
        working-directory: tunnel-node
        run: cargo clippy --all-targets -- -D warnings

      - name: test (tunnel-node)
        working-directory: tunnel-node
        run: cargo test --all-targets

  # JVM-only Kotlin tests against canonical docs/platform-defaults.json — does not run cargo-ndk.
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: PlatformDefaultsContractTest (ConfigStore JVM)
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.farnam.mhrvf.PlatformDefaultsContractTest \
            --no-daemon \
            --stacktrace \
            -x cargoBuildDebug \
            -x cargoBuildRelease \
            -x mergeDebugJniLibFolders \
            -x mergeReleaseJniLibFolders
